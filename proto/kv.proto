syntax = "proto3";

package kv;

option go_package = "github.com/A-s-n55555/distributed-kv-store/proto;kvpb";

service KeyValueStore {
  rpc Put(PutRequest) returns (PutResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);

  rpc ApplyReplicaRecord(ReplicaRecordRequest)
      returns (ReplicaRecordResponse);

  rpc ReadReplicaRecord(GetRequest)
      returns (ReplicaRecordReadResponse);
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
  rpc AntiEntropySummary(AntiEntropySummaryRequest)
      returns (AntiEntropySummaryResponse);

  rpc AntiEntropyBucket(AntiEntropyBucketRequest)
      returns (AntiEntropyBucketResponse);
}

message PutRequest {
  int64 key = 1;
  string value = 2;
}

message PutResponse {}

message GetRequest {
  int64 key = 1;
}

message GetResponse {
  string value = 1;
  bool found = 2;
  repeated VersionedRecord versions = 3;
  map<string, uint64> context = 4;
  bool conflict = 5;
}

message DeleteRequest {
  int64 key = 1;
}

message DeleteResponse {}

// A value or deletion together with its causal version.
message VersionedRecord {
  string value = 1;
  map<string, uint64> clock = 2;
  bool deleted = 3;
}

// Requests that a replica apply a complete versioned record.
message ReplicaRecordRequest {
  int64 key = 1;
  VersionedRecord record = 2;
}

// Acknowledges successful processing.
// An outdated or identical record may be ignored by the store.
message ReplicaRecordResponse {}

message ReplicaRecordReadResponse {
  // Compatibility field for existing single-record readers.
  VersionedRecord record = 1;

  bool exists = 2;

  // Complete version list for sibling-aware readers.
  repeated VersionedRecord records = 3;
}
message ResolveRequest {
  int64 key = 1;
  string value = 2;
  map<string, uint64> context = 3;
  bool deleted = 4;
}

message ResolveResponse {}

// Requests a Merkle summary for data shared by requester and responder.
message AntiEntropySummaryRequest {
  string requester_node_id = 1;
  int32 replication_factor = 2;
  bytes configuration_digest = 3;
}

message AntiEntropySummaryResponse {
  string responder_node_id = 1;
  bytes configuration_digest = 2;
  bytes root_digest = 3;

  // Index in this array is the anti-entropy bucket number.
  // Every entry must be a SHA-256 digest.
  repeated bytes bucket_digests = 4;
}

// Requests records in one differing shared-data bucket.
message AntiEntropyBucketRequest {
  string requester_node_id = 1;
  int32 replication_factor = 2;
  bytes configuration_digest = 3;
  int32 bucket = 4;
}

message AntiEntropyKeyState {
  int64 key = 1;
  repeated VersionedRecord records = 2;
}

message AntiEntropyBucketResponse {
  string responder_node_id = 1;
  bytes configuration_digest = 2;
  int32 bucket = 3;
  repeated AntiEntropyKeyState keys = 4;
}